<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Платформа отчётов</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="wrap">
        <h1>Платформа отчётов</h1>
        <p class="sub">Ввод данных → JSON / PDF / DOCX / отправка CSV на почту</p>

        <section class="card">
            <h2>Данные студента</h2>

            <div class="grid">
                <label>
                    StudentId
                    <input id="studentId" type="number" value="1" />
                </label>

                <label>
                    StudentName
                    <input id="studentName" type="text" value="Test Student" />
                </label>

                <label>
                    TaskCount
                    <input id="taskCount" type="number" value="5" />
                </label>

                <label>
                    AverageGrade
                    <input id="averageGrade" type="text" value="4,2" />
                </label>
            </div>

            <label class="wide">
                Email для отправки CSV
                <input id="email" type="email" placeholder="example@mail.com" />
            </label>

            <div class="btns">
                <button id="jsonBtn" type="button">Сформировать отчёт (JSON)</button>
                <button id="pdfBtn" type="button">Скачать PDF</button>
                <button id="docxBtn" type="button">Скачать DOCX</button>
                <button id="sendCsvBtn" type="button" class="accent">Отправить CSV на почту</button>
                <button id="resetBtn" type="button">Сброс</button>
            </div>
        </section>

        <section class="card">
            <h2>Результат</h2>
            <pre id="output">Пока пусто. Нажми кнопку действия.</pre>
            <div id="statusPill" class="pill">готово</div>
        </section>

        <a class="link" href="/swagger">Swagger</a>
    </main>

    <script src="app.js"></script>
</body>
</html>
